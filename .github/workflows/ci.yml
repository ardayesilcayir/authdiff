name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test (race detector, coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Require >= 80% line coverage in internal/
        run: |
          grep -E '^mode:|/internal/' coverage.out > coverage.internal.out
          total=$(go tool cover -func=coverage.internal.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "internal/ coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t + 0 < 80) ? 1 : 0 }' || {
            echo "::error::internal/ coverage ${total}% is below 80%"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  lab:
    name: vuln-lab tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vuln-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vuln-lab/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
