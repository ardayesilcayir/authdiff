name: authdiff
description: Find authorization bugs (BOLA, BFLA, missing auth, mass assignment) in a REST API and upload the findings as SARIF.
author: ardayesilcayir
branding:
  icon: shield
  color: red

inputs:
  config:
    description: Path to the authdiff config file (authdiff.yaml).
    required: true
  version:
    description: >-
      authdiff version to install: a release tag such as v1.0.0 (recommended,
      reproducible) or latest (whatever was released last).
    required: false
    default: latest
  fail-on:
    description: Fail the step if an active finding has at least this severity (info, low, medium, high, critical).
    required: false
    default: high
  upload-sarif:
    description: Upload results.sarif to GitHub code scanning (needs security-events write permission).
    required: false
    default: "true"

outputs:
  exit-code:
    description: "authdiff exit code: 0 no findings at the threshold, 1 threshold exceeded, 2 error."
    value: ${{ steps.scan.outputs.exit-code }}
  sarif:
    description: Path of the SARIF report (empty if none was written).
    value: ${{ steps.scan.outputs.sarif }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: stable
        check-latest: true
        cache: false

    - name: Install authdiff
      shell: bash
      env:
        AUTHDIFF_VERSION: ${{ inputs.version }}
      # The version is stamped into the binary (authdiff version, User-Agent).
      run: go install -ldflags "-X main.version=${AUTHDIFF_VERSION}" "github.com/ardayesilcayir/authdiff/cmd/authdiff@${AUTHDIFF_VERSION}"

    - name: Run authdiff scan
      id: scan
      shell: bash
      env:
        AUTHDIFF_CONFIG: ${{ inputs.config }}
        AUTHDIFF_FAIL_ON: ${{ inputs.fail-on }}
        AUTHDIFF_OUT: ${{ runner.temp }}/authdiff-out
      run: |
        status=0
        authdiff scan -c "$AUTHDIFF_CONFIG" --format terminal,sarif,json \
          --fail-on "$AUTHDIFF_FAIL_ON" --output "$AUTHDIFF_OUT" --no-color || status=$?
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        if [ -f "$AUTHDIFF_OUT/results.sarif" ]; then
          echo "sarif=$AUTHDIFF_OUT/results.sarif" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true' && steps.scan.outputs.sarif != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: authdiff

    - name: Exit with the scan result
      if: always()
      shell: bash
      env:
        STATUS: ${{ steps.scan.outputs.exit-code }}
      run: exit "${STATUS:-2}"
