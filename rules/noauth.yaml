id: AD-NOAUTH-001
name: Missing authentication
owasp: "API2:2023"
cwe: CWE-306
severity: high
description: >
  An endpoint that should require authentication responds successfully to an anonymous request.
  Unauthenticated callers can reach protected data or functions.
remediation: docs/rules/AD-NOAUTH-001.md
steps:
  - name: ref
    as: any_user
    use: any_user
    # Never send DELETE/PUT/PATCH as an authenticated user just to get a
    # reference: it would change or delete the object the anonymous probe hits.
    skipDestructive: true
  - name: anon
    as: anonymous
    use: any_user
victim: ref
attacker: anon
# An explicit matrix entry that allows anonymous access declares the endpoint
# public, so identifiers in its response are intended (a public directory).
match: >
  anon.ok && !matrixAllows("anon") &&
  (endpoint.secured || matrixForbids("anon") || evidence(anon.body, identifiers))
confidence:
  high: evidence(anon.body, identifiers)
  medium: "true"
