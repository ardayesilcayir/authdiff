# authdiff example config for the bundled vuln-lab (http://localhost:8000).
#
#   make lab                          # start the lab (Docker)
#   set -a; . examples/vuln-lab.env; set +a
#   authdiff scan -c examples/authdiff.yaml
#
# The tokens in examples/vuln-lab.env are FAKE, lab-only credentials.
version: 1
target:
  baseUrl: http://localhost:8000
  spec: http://localhost:8000/openapi.json   # file path (relative to this file) or URL

scope:                                       # no request ever leaves this list
  allowHosts: ["localhost:8000"]
  # You run the lab yourself, so you are authorized to test it.
  acknowledgeAuthorization: true

safety:
  rate: 5                                    # requests per second
  concurrency: 4
  # DELETE/PUT/PATCH are blocked unless true (or --allow-destructive).
  # Destructive scans mutate the lab: restart it afterwards.
  allowDestructive: false
  timeout: 10s

# Tokens are read from the environment; never write secrets into this file.
profiles:
  admin:
    role: admin
    auth: { type: bearer, token: "${env:ADMIN_TOKEN}" }
    owns: { userId: [1], orderId: [11], invoiceId: [9000] }
    identifiers: [admin@vuln.lab]
  alice:
    role: user
    auth: { type: bearer, token: "${env:ALICE_TOKEN}" }
    owns: { userId: [2], orderId: [101, 102], invoiceId: [9001] }
    identifiers: [alice@vuln.lab]
  bob:
    role: user
    auth: { type: bearer, token: "${env:BOB_TOKEN}" }
    owns: { userId: [3], orderId: [201, 202], invoiceId: [9002] }
    identifiers: [bob@vuln.lab]
  anonymous:
    role: none
    auth: { type: none }

harvest:                                     # collect IDs from each profile's own responses
  - endpoint: GET /me/orders
    extract: { orderId: "$.items[*].id" }

compare:
  ignoreFields: ["$.requestId", "$..updatedAt"]
  similarityThreshold: 0.85

output:
  formats: [terminal, json, sarif, html]
  dir: ./authdiff-out
  failOn: high
